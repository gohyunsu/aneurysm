[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-aneurysm"
version = "0.1.0"
description = "Research protocol and data contracts for AURORA"
requires-python = ">=3.10"
license = {text = "Research use; see dataset-specific licenses"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
target-version = "py310"
