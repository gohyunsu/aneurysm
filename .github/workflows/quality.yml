name: Research contract and site quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate research protocol
        run: PYTHONPATH=src python -m aurora.protocol validate configs/aurora_v1.json
      - name: Validate fail-closed public source watch
        run: PYTHONPATH=src python scripts/audit_source_watch.py --config configs/source_watch_v16.json --validate-only
      - name: Validate prospective AneuX preprocessing-orbit P0
        run: PYTHONPATH=src python -m aurora.aneux_preprocessing_orbit_p0 --config configs/aneux_preprocessing_orbit_p0.json --validate-only
      - name: Validate frozen Aneurisk conformal-degree P0 contract
        run: PYTHONPATH=src python -m aurora.aneurisk_conformal_degree_p0 --config configs/aneurisk_conformal_degree_p0.json --validate-only
      - name: Validate prospective VMR growth-paired surface-structure P0
        run: PYTHONPATH=src python -m aurora.vmr_growth_surface_structure_p0 --config configs/vmr_growth_surface_structure_p0.json --validate-only
      - name: Validate frozen open-CTA physical-coordinate P0 registration
        run: PYTHONPATH=src python -m aurora.open_cta_physical_p0 --config configs/open_cta_physical_p0.json --validate-only
      - name: Validate prospective S0a contract
        run: PYTHONPATH=src python -m aurora.goal_oriented_s0a configs/goal_oriented_segmentation_s0a.json
      - name: Validate prospective S0a solver preflight
        run: PYTHONPATH=src python -m aurora.goal_oriented_s0a_solver configs/goal_oriented_segmentation_s0a_solver_preflight.json
      - name: Validate prospective S0a CMHA staging v2
        run: PYTHONPATH=src python -m aurora.goal_oriented_s0a_staging configs/goal_oriented_segmentation_s0a_cmha_stage_v2.json
      - name: Validate prospective S0a source-server asset component
        run: PYTHONPATH=src python -m aurora.goal_oriented_s0a_asset --config configs/goal_oriented_segmentation_s0a_asset_component.json --validate-only
      - name: Run protocol tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check local site graph
        run: python scripts/check_site.py --root .
      - name: Check browser JavaScript syntax
        run: |
          node --check site/assets/aurora.js
          node --check site/assets/research-data.js
          node --check site/assets/learn.js
