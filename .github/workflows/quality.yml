name: Research contract and site quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install scientific contract test dependencies
        run: |
          python -m pip install "numpy==2.1.2" "h5py==3.12.1" "pytest==8.3.3"
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify pinned scientific contract runtime
        run: |
          python - <<'PY'
          import h5py
          import numpy
          import torch

          print(f"numpy={numpy.__version__}")
          print(f"h5py={h5py.__version__}")
          print(f"torch={torch.__version__}")
          assert numpy.__version__ == "2.1.2"
          assert h5py.__version__ == "3.12.1"
          assert torch.__version__.split("+")[0] == "2.5.1"
          PY
      - name: Validate research protocol
        run: PYTHONPATH=src python -m aurora.protocol validate configs/aurora_v1.json
      - name: Validate current non-executable Aneumo response-fidelity P0 v3
        run: PYTHONPATH=src python -c "from aurora.aneumo_response_fidelity_p0_v3 import load_config; load_config('configs/aneumo_response_fidelity_p0_v3.json')"
      - name: Validate fail-closed Aneumo P0 v3 activation code
        run: |
          PYTHONPATH=src python -c "import aurora.aneumo_response_fidelity_p0_v3_activation"
          bash -n cluster/pbs_aneumo_response_fidelity_p0_v3.pbs
      - name: Validate superseded inactive Aneumo response-fidelity P1 v1
        run: PYTHONPATH=src python -m aurora.aneumo_response_fidelity_p1_template validate configs/aneumo_response_fidelity_p1_template_v1.json
      - name: Validate superseded inactive Aneumo response-fidelity P1 v2
        run: PYTHONPATH=src python -m aurora.aneumo_response_fidelity_p1_template_v2 validate configs/aneumo_response_fidelity_p1_template_v2.json
      - name: Validate current inactive Aneumo response-fidelity P1 v3
        run: PYTHONPATH=src python -m aurora.aneumo_response_fidelity_p1_template_v3 validate configs/aneumo_response_fidelity_p1_template_v3.json
      - name: Validate superseded inactive Aneumo independent-confirmation template v1
        run: PYTHONPATH=src python -m aurora.aneumo_response_fidelity_confirmation_template_v1 validate configs/aneumo_response_fidelity_confirmation_template_v1.json
      - name: Validate superseded inactive Aneumo independent-confirmation template v2
        run: PYTHONPATH=src python -m aurora.aneumo_response_fidelity_confirmation_template_v2 validate configs/aneumo_response_fidelity_confirmation_template_v2.json
      - name: Validate current inactive Aneumo independent-confirmation template v3
        run: PYTHONPATH=src python -m aurora.aneumo_response_fidelity_confirmation_template_v3 validate configs/aneumo_response_fidelity_confirmation_template_v3.json
      - name: Validate fail-closed public source watch
        run: PYTHONPATH=src python scripts/audit_source_watch.py --config configs/source_watch_v22.json --validate-only
      - name: Validate withdrawn-before-field Aneumo transient stability P0 v1
        run: PYTHONPATH=src python -m aurora.aneumo_transient_stability_p0 --config configs/aneumo_transient_structure_stability_p0_v1.json --validate-only
      - name: Validate non-executable AneuG processed-v4 D6 registration
        run: PYTHONPATH=src python -c "from aurora.aneug_processed_v4_d6 import load_contract; load_contract('configs/aneug_processed_v4_d6_train_field_audit_v1.json')"
      - name: Validate withdrawn v1 and human-activated AneuG processed-v4 D6 v2
        run: |
          PYTHONPATH=src python -m aurora.aneug_processed_v4_d6_execution --execution-config configs/aneug_processed_v4_d6_execution_v1.json --validate-only
          PYTHONPATH=src python -m aurora.aneug_processed_v4_d6_execution --execution-config configs/aneug_processed_v4_d6_execution_v2.json --validate-only
          bash -n cluster/pbs_aneug_processed_v4_d6_execution_v1.pbs
          bash -n cluster/pbs_aneug_processed_v4_d6_execution_v2.pbs
      - name: Validate data-free introai9 PBS envelope E0
        run: |
          PYTHONPATH=src python -m aurora.aneug_pbs_envelope_e0 --config configs/aneug_pbs_envelope_e0_v1.json --validate-only
          bash -n cluster/pbs_aneug_pbs_envelope_e0_v1.pbs
      - name: Validate dormant non-executable AneuG processed-v4 D7 draft
        run: PYTHONPATH=src python -m aurora.aneug_processed_v4_d7_draft --config configs/aneug_processed_v4_d7_train_field_admission_draft_v1.json --validate-only
      - name: Validate fresh human-activated AneuG processed-v4 D7 execution
        run: |
          PYTHONPATH=src python -m aurora.aneug_processed_v4_d7_execution --execution-config configs/aneug_processed_v4_d7_execution_v1.json --validate-only
          bash -n cluster/pbs_aneug_processed_v4_d7_execution_v1.pbs
      - name: Validate fresh human-activated AneuG processed-v4 D8 geometry audit
        run: |
          PYTHONPATH=src python -m aurora.aneug_processed_v4_d8_geometry_normal_audit --config configs/aneug_processed_v4_d8_geometry_normal_audit_v1.json --validate-only
          bash -n cluster/pbs_aneug_processed_v4_d8_geometry_normal_audit_v1.pbs
      - name: Validate selected bounded AneuG processed-v4 D9 pilot
        run: |
          PYTHONPATH=src python -m aurora.aneug_processed_v4_d9 --config configs/aneug_processed_v4_d9_mesh_canonicalized_pilot_v1.json --mode validate
          bash -n cluster/pbs_aneug_processed_v4_d9_r0_v1.pbs
          bash -n cluster/pbs_aneug_processed_v4_d9_r1_v1.pbs
      - name: Validate bounded AneuG processed-v4 D10 repair round 1
        run: |
          PYTHONPATH=src python -c "from aurora.aneug_processed_v4_d10_bounded_repair import load_config; load_config('configs/aneug_processed_v4_d10_bounded_repair_v1.json')"
          bash -n cluster/pbs_aneug_processed_v4_d10_round1_v1.pbs
      - name: Validate AneuG processed-v4 D11 strong baseline
        run: |
          PYTHONPATH=src python -c "from aurora.aneug_processed_v4_d11_strong_baseline import load_config; load_config('configs/aneug_processed_v4_d11_strong_baseline_v1.json')"
          bash -n cluster/pbs_aneug_processed_v4_d11_strong_baseline_v1.pbs
      - name: Validate AneuG processed-v4 D12 direct official Graph U-Net baseline
        run: |
          PYTHONPATH=src python -c "from aurora.aneug_processed_v4_d12_official_graphunet import load_config; load_config('configs/aneug_processed_v4_d12_official_graphunet_v1.json')"
          PYTHONPATH=src python -c "from aurora.aneug_processed_v4_d12_official_graphunet import load_config; load_config('configs/aneug_processed_v4_d12_official_graphunet_v2.json')"
          bash -n cluster/pbs_aneug_processed_v4_d12_official_graphunet_v1.pbs
          bash -n cluster/pbs_aneug_processed_v4_d12_official_graphunet_v2.pbs
      - name: Validate prepared AneuG D13A response-manifold oracle
        run: |
          PYTHONPATH=src python -m aurora.aneug_processed_v4_d13a_response_oracle --config configs/aneug_processed_v4_d13a_response_oracle_v1.json --validate-only
          bash -n cluster/pbs_aneug_processed_v4_d13a_response_oracle_v1.pbs
      - name: Validate prepared AneuG D13C functional fine-tuning
        run: |
          PYTHONPATH=src python -m aurora.aneug_processed_v4_d13c_functional_finetune --config configs/aneug_processed_v4_d13c_functional_finetune_v1.json --validate-only
          bash -n cluster/pbs_aneug_processed_v4_d13c_functional_finetune_v1.pbs
      - name: Validate cycle-response residual prototype
        run: PYTHONPATH=src python -c "import json; from pathlib import Path; from aurora.cycle_response_residual import validate_config; validate_config(json.loads(Path('configs/aneug_cycle_response_residual_prototype_v1.json').read_text()))"
      - name: Validate result-pending paired model comparison
        run: PYTHONPATH=src python -c "from aurora.aneug_validation_comparison import load_config; load_config('configs/aneug_validation_comparison_v1.json')"
      - name: Validate prediction-blind confirmatory figure protocol
        run: PYTHONPATH=src python -c "import json; from pathlib import Path; from aurora.aneug_figure_protocol import validate_config; validate_config(json.loads(Path('configs/aneug_confirmatory_figure_protocol_v1.json').read_text()))"
      - name: Validate release-aligned AneuG 730-case protocol
        run: |
          PYTHONPATH=src python -m aurora.aneug_official_source_reconciliation --record results/aneug_official_source_reconciliation_20260818.json
          PYTHONPATH=src python -m aurora.aneug_release_730_protocol --config configs/aneug_release_730_protocol_v1.json
          PYTHONPATH=src python -m aurora.aneug_release_v5_normalization_linkage --config configs/aneug_release_v5_normalization_linkage_v1.json --validate-only
          bash -n cluster/pbs_aneug_release_v5_normalization_linkage_v1.pbs
          bash -n cluster/pbs_aneug_release_730_split_v1.pbs
      - name: Validate release-730 response-manifold oracle
        run: |
          PYTHONPATH=src python -m aurora.aneug_release_730_response_oracle --config configs/aneug_release_730_response_oracle_v1.json --validate-only
          bash -n cluster/pbs_aneug_release_730_response_oracle_v1.pbs
      - name: Validate release-730 response-oracle execution relocation
        run: |
          PYTHONPATH=src python -m aurora.aneug_release_730_response_oracle_relocation --relocation-config configs/aneug_release_730_response_oracle_relocation_junjinyong_v1.json --validate-only
          bash -n cluster/pbs_aneug_release_730_response_oracle_relocation_junjinyong_v1.pbs
      - name: Validate release-730 GHD-GPS/GINE strong comparator
        run: |
          PYTHONPATH=src python -m aurora.aneug_release_730_ghd_gps_baseline --config configs/aneug_release_730_ghd_gps_baseline_v1.json --validate-only
          bash -n cluster/pbs_aneug_release_730_ghd_gps_baseline_v1.pbs
      - name: Validate release-730 Transolver strong comparator
        run: |
          PYTHONPATH=src python -m aurora.aneug_release_730_transolver_baseline --config configs/aneug_release_730_transolver_baseline_v1.json --validate-only
          bash -n cluster/pbs_aneug_release_730_transolver_baseline_v1.pbs
      - name: Validate release-730 direct-control selection analyzer
        run: PYTHONPATH=src python -m aurora.aneug_release_730_direct_control_selection --config configs/aneug_release_730_direct_control_selection_v1.json --validate-only
      - name: Validate release-730 candidate selection analyzer
        run: PYTHONPATH=src python -m aurora.aneug_release_730_candidate_selection --config configs/aneug_release_730_candidate_selection_v1.json --validate-only
      - name: Validate matched release-730 steady training scope
        run: PYTHONPATH=src python -c "from aurora.aneug_release_730_steady_training_scope import load_config; load_config('configs/aneug_release_730_steady_training_scope_v1.json')"
      - name: Validate release-730 five-seed confirmation contract
        run: PYTHONPATH=src python -c "from aurora.aneug_release_730_multiseed_confirmation import load_config; load_config('configs/aneug_release_730_multiseed_confirmation_v1.json')"
      - name: Validate one-time release-730 locked-test boundary
        run: |
          PYTHONPATH=src python -m aurora.aneug_release_730_locked_test_evaluation --config configs/aneug_release_730_locked_test_evaluation_v1.json --validate-only
          bash -n cluster/pbs_aneug_release_730_locked_test_evaluation_v1.pbs
      - name: Validate prepared AneuG D14 Transolver control
        run: |
          PYTHONPATH=src python -m aurora.aneug_processed_v4_d14_transolver_control --config configs/aneug_processed_v4_d14_transolver_control_v1.json --validate-only
          bash -n cluster/pbs_aneug_processed_v4_d14_transolver_control_v1.pbs
      - name: Validate conditional non-executable AneuG bounded GPU development template
        run: PYTHONPATH=src python -m aurora.aneug_cycle_moment_bounded_development_template --config configs/aneug_cycle_moment_bounded_development_template_v1.json --validate-only
      - name: Validate prospective AneuX preprocessing-orbit P0
        run: PYTHONPATH=src python -m aurora.aneux_preprocessing_orbit_p0 --config configs/aneux_preprocessing_orbit_p0.json --validate-only
      - name: Validate frozen historical AneuX nested-orbit P0 contract
        run: PYTHONPATH=src python -m aurora.aneux_nested_orbit_p0 --config configs/aneux_nested_orbit_p0.json --validate-only
      - name: Validate frozen rejected AneuX nested-orbit P0 v2 contract
        run: PYTHONPATH=src python -m aurora.aneux_nested_orbit_p0_v2 --config configs/aneux_nested_orbit_p0_v2.json --validate-only
      - name: Validate frozen Aneurisk conformal-degree P0 contract
        run: PYTHONPATH=src python -m aurora.aneurisk_conformal_degree_p0 --config configs/aneurisk_conformal_degree_p0.json --validate-only
      - name: Validate prospective VMR growth-paired surface-structure P0
        run: PYTHONPATH=src python -m aurora.vmr_growth_surface_structure_p0 --config configs/vmr_growth_surface_structure_p0.json --validate-only
      - name: Validate frozen open-CTA physical-coordinate P0 registration
        run: PYTHONPATH=src python -m aurora.open_cta_physical_p0 --config configs/open_cta_physical_p0.json --validate-only
      - name: Validate prospective S0a contract
        run: PYTHONPATH=src python -m aurora.goal_oriented_s0a configs/goal_oriented_segmentation_s0a.json
      - name: Validate prospective S0a solver preflight
        run: PYTHONPATH=src python -m aurora.goal_oriented_s0a_solver configs/goal_oriented_segmentation_s0a_solver_preflight.json
      - name: Validate prospective S0a CMHA staging v2
        run: PYTHONPATH=src python -m aurora.goal_oriented_s0a_staging configs/goal_oriented_segmentation_s0a_cmha_stage_v2.json
      - name: Validate prospective S0a source-server asset component
        run: PYTHONPATH=src python -m aurora.goal_oriented_s0a_asset --config configs/goal_oriented_segmentation_s0a_asset_component.json --validate-only
      - name: Run protocol tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run ICCE revision tests
        run: >-
          PYTHONPATH=src python -m pytest -q
          tests/test_aneug_release_730_icce_revision.py
          tests/test_aneug_release_730_regime_mismatch.py
          tests/test_aneug_release_730_icce_analysis.py
      - name: Check local site graph
        run: python scripts/check_site.py --root .
      - name: Check browser JavaScript syntax
        run: |
          node --check site/assets/aurora.js
          node --check site/assets/research-data.js
          node --check site/assets/learn.js
